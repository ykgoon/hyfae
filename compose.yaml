# Hyfae opportunity machine — one-shot deployment.
#
# Overnight chain (host cron or manual; container exits when done):
#   docker compose run --rm machine bin/run-all
# Optional serve mode (enables cron schedules in workflow YAMLs):
#   docker compose run --rm machine swamp serve --trusted-hosts <hosts>
#
# Networking: host network — the container shares the host's tailnet, so
# grex-foxtrot:8090 resolves via MagicDNS. No Tailscale sidecar needed.
#
# DNS gotcha: the host resolves tailnet names through systemd-resolved
# (nss `resolve` module), which appends the tailnet search domain. Plain
# glibc inside the container only follows resolv.conf search (empty here),
# so bare `grex-foxtrot` fails. Point Docker DNS at Tailscale's Quad-100
# resolver (100.100.100.100, reachable via the shared tailscale0) plus the
# MagicDNS search suffix. Update suffix if the tailnet ever changes name.
services:
  machine:
    build: .
    image: hyfae-machine:latest
    network_mode: host
    dns: [100.100.100.100]
    dns_search: [tail115c8.ts.net]
    # Run as the host user's uid:gid (defaults 1000:1000) so files created
    # on the ./reports bind mount are owned by the host user, not root.
    # Export UID/GID or rely on the shell default; numeric ids need no
    # matching passwd entry inside the image.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: Asia/Kuala_Lumpur
      PROVIDER: ${PROVIDER:-local}
    volumes:
      - hyfae-state:/machine/.swamp
      - ./reports:/machine/reports

volumes:
  hyfae-state:
