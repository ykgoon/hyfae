                  durability: "pending", verdict: "alive"}.
                  Maximum 6 syntheses. If nothing qualifies, output [].
              - role: user
                content: ${{ data.latest("records", "render-tension").attributes.text }}
      - name: falsify
        dependsOn:
          - step: synth
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: llm-local
          methodName: chat
          inputs:
            requestId: falsify
            temperature: 0.3
            maxTokens: 4096
            messages:
              - role: system
                content: >-
                  You are the falsification critic — a dedicated pessimist. The
