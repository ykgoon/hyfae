            text: ${{ data.latest("llm-local", "falsify").attributes.choices[0].message.content }}

  - name: promote
    description: Deterministic cap-3 promotion + weekly digest markdown
    dependsOn:
      - job: synthesize-openrouter
        condition:
          type: completed
      - job: synthesize-local
        condition:
          type: completed
    steps:
      - name: promote-cards
        task:
          type: model_method
          modelIdOrName: records
          methodName: promote
          inputs:
            candidates: ${{ data.findBySpec("records", "synthesis") }}
            week: ${{ inputs.week }}
version: 1
