                  panel {operator, economist, behaviorist, skeptic, convergedObvious}.


                  Output: ONLY a JSON array of the SAME synthesis objects with
                  falsification and panel filled in. Keep all other fields
                  unchanged. If input was empty, output [].
              - role: user
                content: ${{ data.latest("llm-local", "synth").attributes.choices[0].message.content }}
      - name: store
        dependsOn:
