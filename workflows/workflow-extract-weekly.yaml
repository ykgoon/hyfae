id: cb451732-fdb7-4f6f-884f-605dfbcbfa48
name: extract-weekly
description: >-
  Loop 2 — tension extraction. Renders all stored observations deterministically,
  then one LLM pass converts them into tensions with enabling-shift and
  unaddressed-reason fields. Tensions without a shift <=24 months are parked
  dormant by the schema contract.
tags:
  loop: "2"
  cadence: weekly
trigger:
  schedule: "0 7 * * 1"
  inputs:
    provider: openrouter
inputs:
  properties:
    provider:
      type: string
      enum: [openrouter, local, none]
      default: openrouter
      description: LLM backend for the extraction pass
  required: []
jobs:
  - name: render
    description: Deterministic rendering of all stored observations
    steps:
      - name: render-observations
        task:
          type: model_method
          modelIdOrName: records
          methodName: render
          inputs:
            kind: observation
            records: ${{ data.findBySpec("records", "observation") }}

  - name: extract-openrouter
    description: OpenRouter tension extraction (guarded; skipped when provider=local)
    dependsOn:
      - job: render
        condition:
          type: succeeded
    steps:
      - name: llm
        guard: ${{ inputs.provider != "openrouter" }}
        task:
          type: model_method
          modelIdOrName: llm-openrouter
          methodName: chat
          inputs:
            requestId: tension
            temperature: 0.5
            maxTokens: 4096
            messages:
              - role: system
                content: >-
                  You are the tension-extraction stage of an opportunity machine
                  for Southeast Asia. Input: stored observations (structured,
                  with verbatim excerpts and gravity evidence).


                  For each cluster of related observations produce a TENSION:
                  expectation vs reality, who bears the cost, and — most
                  important — unaddressedReason: WHY has this gone unaddressed?
                  ("nobody noticed" may be gold; "five startups died" is a
                  different lesson — say which.) Also identify enablingShift:
                  what changed recently (regulation, API, cost curve, model
                  capability) that makes this NEWLY solvable? If no shift <=24
                  months, set within24mo=false and status="dormant".


                  marketInvariants: list the local constraints (regulatory
                  regime, language, platform lock-in, payment norms) any viable
                  solution must not violate.


                  Output: ONLY a JSON array (no prose, no fences) of objects:
                  id ("tns-" + short slug), observationIds (from the input),
                  expectation, reality, costBearer,
                  enablingShift {whatChanged, date, evidence, within24mo},
                  unaddressedReason, marketInvariants (array of strings),
                  status ("active"|"dormant"), extractorVersion ("extract-weekly.v1").
                  Maximum 8 tensions. If nothing qualifies, output [].
              - role: user
                content: ${{ data.latest("records", "render-observation").attributes.text }}
      - name: store
        dependsOn:
          - step: llm
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: records
          methodName: ingest_text
          inputs:
            kind: tension
            text: ${{ data.latest("llm-openrouter", "tension").attributes.choices[0].message.content }}

  - name: extract-local
    description: Local llama.cpp tension extraction (guarded; skipped when provider=openrouter)
    dependsOn:
      - job: render
        condition:
          type: succeeded
    steps:
      - name: llm
        guard: ${{ inputs.provider != "local" }}
        task:
          type: model_method
          modelIdOrName: llm-local
          methodName: chat
          inputs:
            requestId: tension
            temperature: 0.5
            maxTokens: 4096
            messages:
              - role: system
                content: >-
                  You are the tension-extraction stage of an opportunity machine
                  for Southeast Asia. Input: stored observations (structured,
                  with verbatim excerpts and gravity evidence).


                  For each cluster of related observations produce a TENSION:
                  expectation vs reality, who bears the cost, and — most
                  important — unaddressedReason: WHY has this gone unaddressed?
                  ("nobody noticed" may be gold; "five startups died" is a
                  different lesson — say which.) Also identify enablingShift:
                  what changed recently (regulation, API, cost curve, model
                  capability) that makes this NEWLY solvable? If no shift <=24
                  months, set within24mo=false and status="dormant".


                  marketInvariants: list the local constraints (regulatory
                  regime, language, platform lock-in, payment norms) any viable
                  solution must not violate.


                  Output: ONLY a JSON array (no prose, no fences) of objects:
                  id ("tns-" + short slug), observationIds (from the input),
                  expectation, reality, costBearer,
                  enablingShift {whatChanged, date, evidence, within24mo},
                  unaddressedReason, marketInvariants (array of strings),
                  status ("active"|"dormant"), extractorVersion ("extract-weekly.v1").
                  Maximum 8 tensions. If nothing qualifies, output [].
              - role: user
                content: ${{ data.latest("records", "render-observation").attributes.text }}
      - name: store
        dependsOn:
          - step: llm
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: records
          methodName: ingest_text
          inputs:
            kind: tension
            text: ${{ data.latest("llm-local", "tension").attributes.choices[0].message.content }}
version: 1
