id: e9cf7461-15a0-4bd2-b547-cf6cb1ab67e1
name: collect
description: >-
  Loop 1 — broad observation. Fetch every registered Tier A/B source, run one
  LLM extraction pass over the bundle (cheap model by design), store validated
  observations. Provider is switchable per run: provider=openrouter|local.
tags:
  loop: "1"
  cadence: daily
trigger:
  schedule: "0 6 * * *"
  inputs:
    provider: local
inputs:
  properties:
    provider:
      type: string
      enum: [openrouter, local, none]
      default: local
      description: LLM backend for the extraction pass
  required: []
jobs:
  - name: fetch
    description: Deterministic fan-out fetch of all registered sources
    steps:
      - name: fetch-all
        task:
          type: model_method
          modelIdOrName: sources
          methodName: fetch_all

  - name: extract-openrouter
    description: OpenRouter extraction pass (guarded; skipped when provider=local)
    dependsOn:
      - job: fetch
        condition:
          type: succeeded
    steps:
      - name: llm
        guard: ${{ inputs.provider != "openrouter" }}
        task:
          type: model_method
          modelIdOrName: llm-openrouter
          methodName: chat
          inputs:
            requestId: collect
            temperature: 0.4
            maxTokens: 4096
            messages:
              - role: system
                content: >-
                  You are the collector stage of the Hyfae opportunity-scouting machine
                  focused on Southeast Asia (MY/ID/TH/VN/PH). You receive raw
                  excerpts fetched from forums, app reviews and regulator pages.
                  Extract OBSERVATIONS of friction behavior —
                  workarounds, grey markets, queues, hiring duct-tape,
                  rituals, policy shifts. `price_asymmetry` is dormant (no carrier).


                  Hard rules:
                  - rawExcerpt MUST be a verbatim quote in the original language. Never translate.
                  - Zero invention: only what the excerpt shows.
                  - economic gravity is mandatory: classify the touchpoint
                    (transaction | compliance | labor), estimate monthlyCostEst in
                    MYR-equivalent, cite the excerpt as evidence, count how many
                    independent excerpt blocks support it (independentSources).
                  - Drop anything with no plausible money in motion.
                  - firstSeen: today's date, ISO. collectorVersion: "collect-daily.v1".

                  Output: ONLY a JSON array (no prose, no fences) of objects with
                  exactly these fields:
                  id ("obs-" + short slug of sourceName + hash of excerpt),
                  sourceName, sourceRef (the url in the SOURCE header),
                  tier ("A"|"B"|"C"), rawExcerpt, language, market,
                  artifactClass (workaround|grey_market|queue|hire_ducttape|price_asymmetry|ritual|policy_shift|other),
                  actor, workflow, friction,
                  gravity {touchpoint, monthlyCostEst, evidence, independentSources},
                  firstSeen, collectorVersion.
                  Maximum 10 observations, only the strongest. If nothing qualifies, output [].
              - role: user
                content: ${{ data.latest("sources", "bundle").attributes.text }}
      - name: store
        dependsOn:
          - step: llm
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: records
          methodName: ingest_text
          inputs:
            kind: observation
            text: ${{ data.latest("llm-openrouter", "collect").attributes.choices[0].message.content }}

  - name: extract-local
    description: Local llama.cpp extraction pass (guarded; skipped when provider=openrouter)
    dependsOn:
      - job: fetch
        condition:
          type: succeeded
    steps:
      - name: llm
        guard: ${{ inputs.provider != "local" }}
        task:
          type: model_method
          modelIdOrName: llm-local
          methodName: chat
          inputs:
            requestId: collect
            temperature: 0.4
            maxTokens: 4096
            messages:
              - role: system
                content: >-
                  You are the collector stage of the Hyfae opportunity-scouting machine
                  focused on Southeast Asia (MY/ID/TH/VN/PH). You receive raw
                  excerpts fetched from forums, app reviews and regulator pages.
                  Extract OBSERVATIONS of friction behavior —
                  workarounds, grey markets, queues, hiring duct-tape,
                  rituals, policy shifts. `price_asymmetry` is dormant (no carrier).


                  Hard rules:
                  - rawExcerpt MUST be a verbatim quote in the original language. Never translate.
                  - Zero invention: only what the excerpt shows.
                  - economic gravity is mandatory: classify the touchpoint
                    (transaction | compliance | labor), estimate monthlyCostEst in
                    MYR-equivalent, cite the excerpt as evidence, count how many
                    independent excerpt blocks support it (independentSources).
                  - Drop anything with no plausible money in motion.
                  - firstSeen: today's date, ISO. collectorVersion: "collect-daily.v1".

                  Output: ONLY a JSON array (no prose, no fences) of objects with
                  exactly these fields:
                  id ("obs-" + short slug of sourceName + hash of excerpt),
                  sourceName, sourceRef (the url in the SOURCE header),
                  tier ("A"|"B"|"C"), rawExcerpt, language, market,
                  artifactClass (workaround|grey_market|queue|hire_ducttape|price_asymmetry|ritual|policy_shift|other),
                  actor, workflow, friction,
                  gravity {touchpoint, monthlyCostEst, evidence, independentSources},
                  firstSeen, collectorVersion.
                  Maximum 10 observations, only the strongest. If nothing qualifies, output [].
              - role: user
                content: ${{ data.latest("sources", "bundle").attributes.text }}
      - name: store
        dependsOn:
          - step: llm
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: records
          methodName: ingest_text
          inputs:
            kind: observation
            text: ${{ data.latest("llm-local", "collect").attributes.choices[0].message.content }}
version: 1
