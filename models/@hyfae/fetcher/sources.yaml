    # gaji bands + WhatsApp-apply (firm-as-actor labor signal). JobStreet and
    # maukerja both 403 Cloudflare bot-wall 2026-09-29 — rejected. Mudah
    # verified 200 2026-09-29 (546KB raw → 38k text; HIRING/gaji/immediate-
    # hiring ads dense within 20k cap; category-nav boilerplate ~3k head).
    - name: mudah-jobs-my
      url: https://www.mudah.my/malaysia/jobs
      tier: A
      language: ms
      market: MY
      artifactClasses: [hire_ducttape]
      extract: html
