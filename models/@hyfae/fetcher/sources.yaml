    # Local-language forum surface (Tier A, workaround culture) — thread-level
    # RSS, NOT the www.lowyat.net homepage (front-page noise). Carries thread
    # titles + post text. Verified 200 2026-09-21 via curl; forum index HTML
    # returned empty through the fetcher runtime (bot-wall), RSS is the
    # fallback per design D3.
    - name: lowyat-network
      url: https://forum.lowyat.net/rss.php
      tier: A
      language: ms
      market: MY
      artifactClasses: [workaround, grey_market]
      extract: text
